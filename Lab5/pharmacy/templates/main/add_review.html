{% extends 'base.html' %}

{% block title %}Add Review - Pharmacy{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h2 class="mb-0">Add Your Review</h2>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Rating</label>
                            <div class="rating">
                                {% for i in "54321"|make_list %}
                                    <input type="radio" name="rating" value="{{ i }}" id="star{{ i }}" required>
                                    <label for="star{{ i }}">
                                        <i class="fas fa-star"></i>
                                    </label>
                                {% endfor %}
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="review-text" class="form-label">Your Review</label>
                            <textarea class="form-control" id="review-text" name="text" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Submit Review</button>
                        <a href="{% url 'main:reviews' %}" class="btn btn-outline-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
    .rating {
        display: flex;
        flex-direction: row-reverse;
        justify-content: flex-end;
    }
    .rating input {
        display: none;
    }
    .rating label {
        cursor: pointer;
        padding: 5px;
        color: #ddd;
    }
    .rating input:checked ~ label,
    .rating label:hover,
    .rating label:hover ~ label {
        color: #ffc107;
    }
</style>
{% endblock %}
